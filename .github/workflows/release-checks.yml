name: Release Infrastructure Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Check static website download integration
        run: |
          node --check website/download.js
          node --check website/latest-version.js
          node --check website/main.js
          node --check website/privacy-field.js
          node --test website/tests/*.test.cjs
